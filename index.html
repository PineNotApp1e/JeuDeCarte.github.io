<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil - Jeu de Cartes</title>
    <!-- Chargement de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <style>
        /* Design du fond (dégradé sombre de style "Gaming") */
        body {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Section Principale (Hero) */
        .hero-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 3rem 1rem;
        }

        /* Titre du jeu */
        .game-title {
            font-size: 4rem;
            font-weight: 900;
            background: -webkit-linear-gradient(#ff6b6b, #c0392b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            text-shadow: 0 4px 20px rgba(220, 53, 69, 0.3);
        }

        /* Bouton Jouer */
        .btn-play {
            font-size: 1.5rem;
            padding: 1rem 3.5rem;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(220, 53, 69, 0.4);
            transition: all 0.3s ease;
        }

        .btn-play:hover {
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 8px 25px rgba(220, 53, 69, 0.6);
        }

        /* Cartes des règles (Effet Verre / Glassmorphism) */
        .rule-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 2rem 1rem;
            margin: 1rem;
            transition: transform 0.3s ease, background 0.3s ease;
            height: 100%;
        }

        .rule-card:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.1);
        }

        .emoji-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
